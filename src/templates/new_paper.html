<!DOCTYPE html>
<html>
<head>
    <title>Uusi artikkeli</title>
</head>
<body>

    <p>
        <a href="/"><button type="button">Takaisin etusivulle</button></a>
    </p>

    <h1>Lisää uusi artikkeli</h1>
    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}
    <form action="/add_paper" method="post">
        <p>
            <label for="key">Viiteavain:</label>
            <input type="text" name="key" required>
        </p>

        <p>
            <label for="author">Tekijä:</label>
            <input type="text" name="author" id='author' required>
        </p>

        <p>
            <label for="title">Otsikko:</label>
            <input type="text" name="title" required>
        </p>

        <p>
            <label for="journal">Julkaisu:</label>
            <input type="text" name="journal" >
        </p>

        <p>
            <label for="year">Vuosi:</label>
            <input type="number" name="year" required>
        </p>

        <p>
            <label for="volume">Vuosikerta:</label>
            <input type="number" name="volume">
        </p>

        <p>
            <label for="number">Numero:</label>
            <input type="number" name="number">
        </p>

        <p>
            <label for="pages">Sivut:</label>
            <input type="text" name="pages">
        </p>

        <button type="submit">Lisää artikkeli</button>
    </form>
    
</body>
</html>
